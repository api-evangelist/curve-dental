aid: curve-dental
name: Curve Dental
description: >-
  Curve Dental is a cloud-based, all-in-one dental practice management software company founded in 2004
  and headquartered in Alpharetta, Georgia. Its flagship platform, Curve Hero, serves more than 80,000
  dental professionals across the United States and Canada, unifying scheduling, clinical and perio
  charting, imaging, billing, insurance, smart forms, reporting, patient engagement, and business
  analytics in a single browser-based system. Curve is privately held and backed by Battery Ventures,
  and connects to a growing ecosystem of integration partners (including DentalXChange, DentalHQ, Pearl
  AI, Bola AI, and Mango Voice) rather than exposing a public self-serve developer API. This profile was
  seeded from Battery Ventures' portfolio and enriched from Curve Dental's public web surface; no public
  OpenAPI, SDK, or developer portal was found during enrichment.
